name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  publish-github:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      - name: Verify release version and notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm ci
      - run: uv sync --frozen --python 3.12
      - run: npm run build
      - name: Test installation package sources
        run: |
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          uv run pytest -m "not slow and not integration" --benchmark-disable
      - name: Build installation package
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release --json > pack-result.json
          ARCHIVE=$(node -p "require('./pack-result.json')[0].filename")
          VERSION=$(node -p "require('./package.json').version")
          mv "release/$ARCHIVE" "release/book-download-mcp-$VERSION.tgz"
          cp INSTALL.md release/INSTALL.md
          if tar tzf "release/book-download-mcp-$VERSION.tgz" | grep -E '/\.env($|[./]|rc$)|\.test\.|\.spec\.|__tests__|\.pyc$'; then
            echo "ERROR: installation package contains excluded files"
            exit 1
          fi
      - name: Checksum installation files
        working-directory: release
        run: sha256sum *.tgz INSTALL.md > SHA256SUMS
      - name: Publish GitHub installation package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tgz release/INSTALL.md release/SHA256SUMS
          --verify-tag --latest
          --title "Book Download MCP $GITHUB_REF_NAME"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"

  publish-npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lfs: false — the repo exceeded its Git LFS budget, which fails
          # actions/checkout outright. Unhydrated-pointer guards in
          # __tests__/python/conftest.py skip the affected tests with a clear
          # reason (surfaced by pytest -rs). Restore to true if the budget
          # is ever restored. See #85.
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run build
      - name: Run tests
        run: |
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          uv run pytest -m "not slow and not integration" --benchmark-disable
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      # Pinned to the npm@11 major — `npm@latest` is what broke releases v1.2
      # through v1.2.1 when its engines field outran the runner's Node.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # Auth comes from npm's OIDC trusted publisher for this repo/workflow —
      # no NODE_AUTH_TOKEN. Provenance is generated automatically under OIDC.
      - name: Publish with provenance
        run: npm publish --provenance --access public

  # Ships the same release as a container image so Docker users get versioned
  # tags instead of having to build from source (requested in issue #9).
  # Tag pushes only: a workflow_dispatch has no semver ref, so metadata-action
  # would derive zero tags and the push step would fail.
  publish-docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
